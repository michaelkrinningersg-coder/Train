services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: railandroad
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U game -d railandroad']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
